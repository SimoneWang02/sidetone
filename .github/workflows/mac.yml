# The macOS overlay built and pictured on GitHub's Macs, and the hub's tests run there, since the
# author has no Mac at hand. Pictures: the run's "pictures" artifact (gh run download).
name: mac
on:
  push:
    branches: [mac-overlay]
  workflow_dispatch:
jobs:
  overlay:
    # macOS 15, and macOS 26 for its Liquid Glass (a newer runner, which may not always be there).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-26' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          sw_vers; swiftc --version
          system_profiler SPDisplaysDataType | grep -iE 'resolution|metal|chipset|model' || true
          echo "reduce transparency: $(defaults read com.apple.universalaccess reduceTransparency 2>&1)"
      - name: Build
        run: |
          mkdir -p build pictures
          set -o pipefail
          swiftc -O -o build/sidetone-overlay overlay/mac/*.swift 2>&1 | tee pictures/compile.log
      - name: Pictures
        run: python3 tests/mac_check.py build/sidetone-overlay pictures
      - name: The hub, started by a hook, building and starting the overlay itself
        if: always()
        run: python3 tests/mac_hub_check.py pictures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pictures-${{ matrix.os }}
          path: pictures
  hub:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packages
        run: python -m pip install numpy sounddevice soundfile onnxruntime faster-whisper
      - name: Tests
        run: |
          set -o pipefail
          python -I -m unittest discover -s tests 2>&1 | tail -150
  voice:
    # Kokoro on Apple Silicon, played through PortAudio as the hub plays it.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packages and the voice model
        run: |
          python -m pip install kokoro-onnx sounddevice soundfile
          mkdir -p kokoro
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            curl -fsSL -o kokoro/$f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f
          done
      - name: Voice
        run: python -I tests/mac_voice_check.py kokoro
