# Sidetone on Windows itself (no WSL) on GitHub's Windows machines: the hook program built and
# run as Claude Code runs it, starting the real hub, which is reached on a local port.
name: windows
on:
  push:
    branches: [mac-overlay]
  workflow_dispatch:
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packages
        run: python -m pip install numpy sounddevice soundfile
      - name: Check
        run: python -I tests/win_check.py
  install:
    # install.ps1 from nothing but uv, as a person would run it (the voice model left out).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: uv
        run: powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
      - name: Install
        shell: pwsh
        run: |
          $env:Path = "$HOME\.local\bin;$env:Path"
          powershell -ExecutionPolicy Bypass -File install.ps1 -Languages en -NoModels
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content "$HOME\.claude\settings.json" | Select-Object -First 30
          Get-ChildItem "$env:LOCALAPPDATA\sidetone"
  voice:
    # Kokoro on Windows, played through PortAudio as the hub plays it.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packages and the voice model
        shell: bash
        run: |
          python -m pip install kokoro-onnx sounddevice soundfile
          mkdir -p kokoro
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            curl -fsSL -o kokoro/$f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f
          done
      - name: Voice
        run: python -I tests/mac_voice_check.py kokoro
