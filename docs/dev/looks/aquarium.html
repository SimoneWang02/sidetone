<meta name="claude:viewport-fit-sides" content="cover">
<title>Sidetone Aquarium</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: the tank is the page; the sessions and the controls sit under it. */
:root{--bg:#e4eef0;--card:#f6fafa;--fg:#10262c;--soft:#4d686f;--line:#bfd3d7;--accent:#006896;--on:#fff;--wait:#b36b00;
--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Nunito Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d181c;--card:#17262b;--fg:#e6f1f3;--soft:#9bb4ba;--line:#2b4148;--accent:#58b4dc;--on:#08161d;--wait:#ffb84a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d181c;--card:#17262b;--fg:#e6f1f3;--soft:#9bb4ba;--line:#2b4148;--accent:#58b4dc;--on:#08161d;--wait:#ffb84a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--body)}
main{max-width:1120px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1{font:700 clamp(28px,4vw,38px)/1.1 var(--display);margin:0}
p{margin:0;max-width:65ch;color:var(--soft)}
.tank{position:relative;border-radius:18px;overflow:hidden;background:#0c5873}
canvas{display:block;width:100%;cursor:pointer}
.ask{background:#fffaf0;color:#2b1d06;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between}
.ask div{min-width:0;flex:1 1 180px}.ask b{display:block}.ask span{font-size:13px}
.ask .two{display:flex;gap:26px;flex:0 0 auto}
.ask button{background:#fff;color:#2b1d06;border-color:#c9a25b}.ask .yes{background:#8a5200;color:#fff;border-color:#8a5200}
.row{display:flex;flex-wrap:wrap;gap:8px}
.ctl{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end}
.ctl>div{display:grid;gap:6px;min-width:0}
.ctl strong,.ctl label{font-weight:700;font-size:14px}
button{font:600 14px/1 var(--body);padding:10px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.row button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.list button{text-align:left;line-height:1.35;border-left:7px solid var(--c);overflow-wrap:anywhere}
.list button span{display:block;font-weight:400;font-size:12.5px;color:var(--soft)}
.list button.w span{color:var(--wait);font-weight:700}
.list button[aria-pressed="true"]{outline:2px solid var(--accent)}
input[type=range]{width:min(210px,70vw);accent-color:var(--accent)}
</style>
<main>
<header><h1>Every session is a fish</h1><p>Press a fish, then give it a state. Whoever needs you swims to the glass and stays there.</p></header>
<section class="tank" aria-label="Aquarium"><canvas id="cv" role="img" aria-label="Plush fish, one for each session. The same sessions are listed below."></canvas><div class="ask" id="ask" hidden><div><b id="askname"></b><span id="asktext"></span></div><div class="two"><button type="button" id="allow" class="yes">Allow</button><button type="button" id="deny">Deny</button></div></div></section>
<div class="list" id="list" aria-label="Sessions"></div>
<section class="ctl" aria-label="Controls">
<div><strong id="who"></strong><div class="row" id="states"></div></div>
<div><label for="context">Context <output id="ctxout"></output></label><input type="range" id="context" min="0" max="100" value="30"></div>
<div><label for="count">Sessions <output id="countout"></output></label><input type="range" id="count" min="1" max="20" value="5"></div>
<div><strong>Swimming</strong><div class="row" id="motion"></div></div>
<div><strong>Subagents</strong><div class="row"><button type="button" id="fry" aria-pressed="false">Two small fish</button></div></div>
</section>
</main>
<script>
const circ=(x,y,r,q=r)=>`M${x-r} ${y}a${r} ${q} 0 1 0 ${2*r} 0a${r} ${q} 0 1 0 ${-2*r} 0Z`;

const STATES=[["idle","Idle"],["working","Working"],["speaking","Speaking"],["needs","Needs you"],["done","Done"],["failed","Failed"]],LABEL=Object.fromEntries(STATES);

function grid(){const aw=W-30,ah=H-100,cols=Math.min(n,Math.max(1,Math.ceil(Math.sqrt(n*aw/ah*.72)))),rows=Math.ceil(n/cols),cw=aw/cols,ch=ah/rows;return{cols,rows,cw,ch,px:Math.max(44,Math.min(150,cw*.92,ch*1.15))}}
