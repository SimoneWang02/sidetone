<style>
/* Layout: today's overlay and the same one with a plushie, side by side at real size, then the controls. */
:root{--bg:#e6edf0;--card:#f6f9fa;--fg:#14242c;--soft:#526670;--line:#c5d2d8;--accent:#006896;--on:#fff;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Nunito Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191e;--card:#19262d;--fg:#e8f0f3;--soft:#9db1bb;--line:#2e414b;--accent:#58b4dc;--on:#08161d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10191e;--card:#19262d;--fg:#e8f0f3;--soft:#9db1bb;--line:#2e414b;--accent:#58b4dc;--on:#08161d;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--body)}
main{max-width:1090px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1{font:700 clamp(27px,4vw,36px)/1.1 var(--display);margin:0}p{margin:6px 0 0;max-width:65ch;color:var(--soft)}
h2{font:700 17px/1.2 var(--display);margin:0 0 8px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:20px}
.pair>div{min-width:0}
.desk{overflow-x:auto;border-radius:12px;background:#1e1f2b}
.desk.paper{background:#f4f5f7}
.in{position:relative;width:500px;height:348px;margin-left:auto;font:400 13px/1.35 "Segoe UI",system-ui,sans-serif;overflow:hidden}
.code{position:absolute;inset:18px 18px auto;white-space:pre;font:400 12.5px/1.75 Consolas,monospace;color:#8d93ab}
.paper .code{color:#5a6372}
.rail{position:absolute;right:14px;top:74px;width:52px;padding:4px 4px;border-radius:12px;background:linear-gradient(180deg,rgba(50,56,70,.94),rgba(22,24,30,.95));border:1px solid rgba(255,255,255,.16)}
.cell{height:44px;display:grid;place-items:center;border-radius:9px}.cell.on{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.cell svg{width:28px;height:28px;overflow:visible}
.glass{position:absolute;right:72px;border-radius:12px;background:linear-gradient(180deg,rgba(50,56,70,.95),rgba(20,22,28,.96));border:1px solid rgba(255,255,255,.17);color:#f2f4f8}
.bub{width:380px;padding:8px 14px 10px;min-height:64px;display:flex;gap:10px;align-items:center}
.words{position:relative;min-width:0;flex:1}.words b{font-weight:600;font-size:13.5px}.ttl{margin-left:8px}
.words canvas{position:absolute;right:-4px;top:0;width:110px;height:100%;opacity:.55}.words div{position:relative}
.who{font-weight:600;font-size:13.5px}
.req{width:380px;padding:10px 14px 11px;display:flex;gap:12px;align-items:center}
.req>div:last-child{min-width:0;flex:1}
.mono{font:400 12.5px Consolas,monospace;margin:4px 0 6px}
.k{display:inline-block;border:1px solid #c98f17;background:rgba(255,179,0,.16);border-radius:4px;padding:0 6px;font-weight:600;font-size:12px;margin-right:2px;color:#fff}.act{color:#ffb300;margin:0 12px 0 4px}.faint{color:#a9b0bd;font-size:12px}
.pan{width:380px;padding:8px 6px}
.r{display:flex;gap:9px;align-items:center;height:44px;padding:0 8px;border-radius:8px}.r.on{background:rgba(255,255,255,.09)}.r>div:last-child{min-width:0}.r small{display:block;font-size:12px;color:#b4bac6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot{flex:none;position:relative}.slot.top{position:absolute;left:20px;bottom:calc(100% - 7px)}
.popin{animation:popin .09s ease-out 1}
@keyframes popin{from{transform:scale(.6) translateY(20%);opacity:.2}}
.ctl{display:grid;gap:16px}.ctl strong{display:block;font-size:14px;margin-bottom:6px}.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:600 14px/1 var(--body);padding:10px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pick button{display:grid;justify-items:center;gap:4px;padding:8px 10px;min-width:70px;font-size:12.5px}.pick canvas{width:44px;height:44px}
/* a plushie: ground shadow, then a body that moves as one */
.plush{position:relative;width:var(--px);height:var(--px)}
.plush::before{content:"";position:absolute;left:16%;right:16%;bottom:4%;height:9%;border-radius:50%;background:rgba(8,18,24,.28);filter:blur(5px)}
.mv,.mv>*{position:absolute;inset:0;width:100%;height:100%}
.mv{transform-origin:50% 92%}
.limb{transform-origin:var(--lo)}
.kid{position:absolute;width:38%;height:38%;bottom:1%;left:-19%;display:none}
.kid.b{left:auto;right:-19%}
.kids .kid{display:block}
.f{opacity:0}
.s-idle .f-open,.s-working .f-open,.s-speaking .f-open,.s-idle .f-smile,.s-working .f-smile,.s-needs .f-wide,.s-needs .f-o,.s-done .f-happy,.s-done .f-smile,.s-failed .f-sad,.s-failed .f-frown,.s-speaking .f-talk{opacity:1}
.prop{opacity:0}
.s-working .p-task,.s-needs .p-sign,.s-done .p-star,.s-failed .p-thread{opacity:1}
.p-sign{transform-origin:82% 62%}.p-task{transform-origin:50% 70%}
.s-failed .mv{transform:rotate(13deg) scale(1.04,.88);transition:transform .3s ease-out}
.s-failed .limb{transform:rotate(28deg);transition:transform .3s}
.s-needs .mv{transform:scale(.98,1.05)}
.s-needs .limb{transform:rotate(-9deg) scale(1.08)}
.s-idle .f-open{animation:blink 7s infinite}
.s-working .mv{animation:lean 5s ease-in-out infinite}
.s-working .p-task{animation:work 2.5s ease-in-out infinite}
.s-speaking .limb{transform:scale(1,calc(.96 + var(--v,0)*.16))}
.f-talk{transform-box:fill-box;transform-origin:50% 50%;transform:scale(calc(.75 + var(--v,0)*.35),calc(.3 + var(--v,0)*1.05))}
.s-needs .mv{animation:sway 1s ease-in-out 5}
.s-done .mv{animation:settle .4s ease-out 1}
.s-done .p-star{animation:pop .4s ease-out 1}
@keyframes blink{0%,96%,100%{opacity:1}97.5%{opacity:.05}}
@keyframes lean{50%{transform:rotate(2deg) translateY(1%)}}
@keyframes work{50%{transform:rotate(-7deg)}}
@keyframes chat{from{transform:scale(1,.94)}to{transform:scale(1.04,1.13) rotate(2deg)}}
@keyframes talk{from{transform:scale(.8,.45)}to{transform:scale(1.1,1.25)}}
@keyframes sway{0%,100%{transform:scale(.98,1.05)}25%{transform:scale(.98,1.05) rotate(6deg)}75%{transform:scale(.98,1.05) rotate(-6deg)}}
@keyframes settle{0%{transform:translateY(-7%) scale(.97,1.05)}60%{transform:scale(1.07,.92)}100%{transform:none}}
@keyframes pop{from{transform:scale(.5)}}
@media (prefers-reduced-motion:reduce){.plush *{animation:none!important;transition:none!important}}
.s-listen .f-wide,.s-listen .f-smile{opacity:1}.s-listen .limb{transform:rotate(-10deg) scale(1.1)}.s-listen .mv{transform:rotate(-5deg)}
.s-sent .f-happy,.s-sent .f-smile{opacity:1}.s-sent .mv{animation:settle .4s ease-out 1}
.plush.mini .prop{display:none}
</style>
